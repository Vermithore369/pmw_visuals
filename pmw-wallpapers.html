    <script>
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');
        const mouse = { x: null, y: null };
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            createParticles();
        }

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 0.25;
                this.vy = (Math.random() - 0.5) * 0.25;
                this.size = Math.random() * 1.6 + 0.4;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,255,255,0.28)';
                ctx.fill();
            }
        }

        function createParticles() {
            particles = [];
            const count = Math.min(70, Math.floor((canvas.width * canvas.height) / 18000));
            for (let i = 0; i < count; i++) particles.push(new Particle());
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(particle => {
                particle.update();
                particle.draw();
            });
            requestAnimationFrame(animateParticles);
        }

        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('mousemove', e => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });
        resizeCanvas();
        animateParticles();

        const configuredCategories = window.PMW_WALLPAPER_CATEGORIES || [];
        let wallpapers = [];
        let randomizedWallpapers = [];
        const pageParams = new URLSearchParams(window.location.search);
        const requestedCategory = pageParams.get('category');
        const requestedDevice = pageParams.get('device');
        let activeCategory = 'All';
        let activeDevice = 'mobile';
        let activeStyle = 'All';
        let activeAccess = 'All';
        let searchQuery = '';
        let authReady = false;
        let signedInUser = null;
        let isPremiumMember = false;

        const grid = document.getElementById('wallpapersGrid');
        const quickFilters = document.getElementById('quickFilters');
        const categoryFilterSelect = document.getElementById('categoryFilterSelect');
        const deviceToggle = document.getElementById('deviceToggle');
        const styleFilterSelect = document.getElementById('styleFilterSelect');
        const accessFilterSelect = document.getElementById('accessFilterSelect');
        const search = document.getElementById('wallpaperSearch');
        const hero = document.getElementById('wallpaperHero');
        const panel = document.getElementById('wallpaperPanel');
        const panelClose = document.getElementById('panelClose');
        const panelDownload = document.getElementById('panelDownload');
        const panelImageFrame = document.getElementById('panelImageFrame');
        let selectedWallpaper = null;

        const categoryDisplayLabels = {
            All: 'All Wallpapers',
            AMOLED: 'AMOLED Wallpapers',
            Anime: 'Anime Wallpapers',
            'Dark Aesthetic': 'Dark Aesthetic',
            'Dark Fantasy': 'Dark Fantasy',
            Nature: 'Nature Wallpapers',
            Romantic: 'Romantic Wallpapers',
            'Space and Galaxy': 'Galaxy Wallpapers',
            'Celestial Samurai': 'Samurai Wallpapers',
            Minimalist: 'Minimal Wallpapers'
        };

        const featuredCategories = [
            { label: 'Anime', value: 'Anime', aliases: ['anime'] },
            { label: 'Nature', value: 'Nature', aliases: ['nature', 'natures'] },
            { label: 'Galaxy', value: 'Space and Galaxy', aliases: ['space and galaxy', 'galaxy', 'space'] },
            { label: 'Fantasy', value: 'Dark Fantasy', aliases: ['dark fantasy', 'fantasy'] },
            { label: 'Dark Aesthetic', value: 'Dark Aesthetic', aliases: ['dark aesthetic', 'aesthetic', 'dark'] },
            { label: 'AMOLED', value: 'AMOLED', aliases: ['amoled'] },
            { label: 'Minimal', value: 'Minimalist', aliases: ['minimal', 'minimalist'] },
            { label: 'Samurai', value: 'Celestial Samurai', aliases: ['celestial samurai', 'samurai'] }
        ];

        function getCategoryLabel(category) {
            return categoryDisplayLabels[category] || category;
        }

        function normalizeCategoryType(value) {
            const normalized = normalize(value);
            if (!normalized || normalized === 'desktop wallpapers') return '';
            if (normalized === 'nature desktop') return 'Nature';
            if (normalized === 'space') return 'Space and Galaxy';
            return value;
        }

        function updateCategorySeo(category) {
            const subject = category === 'All' ? 'PMW Visuals' : category;
            const pageTitle = category === 'All'
                ? 'PMW Wallpapers - Desktop, Mobile & 4K Wallpapers'
                : `${category} Wallpapers - Free HD Downloads | PMW Visuals`;
            let description = `Download high-quality ${subject} wallpapers for mobile and desktop. Free HD wallpaper from PMW Visuals.`;

            if (description.length < 120) {
                description += ' Free to download and enjoy.';
            }

            document.title = pageTitle;
            document.querySelector('meta[name="description"]').setAttribute('content', description);
        }

        function normalize(value) {
            return String(value || '').toLowerCase().trim();
        }

        function escapeHtml(value) {
            return String(value || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function uniqueList(values) {
            const seen = new Set();
            return values
                .flatMap(value => Array.isArray(value) ? value : [value])
                .map(value => String(value || '').trim())
                .filter(Boolean)
                .filter(value => {
                    const key = normalize(value);
                    if (seen.has(key)) return false;
                    seen.add(key);
                    return true;
                });
        }

        function getItemTypes(item) {
            return uniqueList([
                Array.isArray(item.types) ? item.types : [],
                Array.isArray(item.categories) ? item.categories : [],
                item.category
            ].map(value => Array.isArray(value) ? value.map(normalizeCategoryType) : normalizeCategoryType(value)));
        }

        function getItemTags(item) {
            return uniqueList([item.tags || [], item.hashtags || []]).map(tag => tag.replace(/^#+/, '').toLowerCase());
        }

        function normalizeDesktopWallpapers(items = []) {
            return (Array.isArray(items) ? items : []).map((item, index) => {
                const width = Number(item.width) || 0;
                const height = Number(item.height) || 0;
                const rawCategory = item.category || 'Desktop Wallpapers';
                const category = normalize(rawCategory) === 'nature desktop'
                    ? 'Nature'
                    : normalize(rawCategory) === 'space'
                        ? 'Space and Galaxy'
                        : normalize(rawCategory) === 'desktop wallpapers'
                            ? 'Wallpapers'
                            : rawCategory;
                const types = uniqueList([
                    item.types || [],
                    item.categories || [],
                    category
                ]);
                const id = item.id || `desktop-wallpaper-${index + 1}`;
                const imageUrl = item.imageUrl || item.image || item.preview || item.thumbnail || item.download;
                return {
                    ...item,
                    id,
                    title: item.title || 'Desktop Wallpaper',
                    description: item.description || 'A wide desktop wallpaper from PMW Visuals.',
                    imageUrl,
                    preview: item.preview || imageUrl,
                    thumbnail: item.thumbnail || item.preview || imageUrl,
                    download: item.download || imageUrl,
                    category,
                    types,
                    categories: types,
                    tags: uniqueList([item.tags || [], 'desktop wallpaper', '16:9 wallpaper']),
                    deviceTypes: uniqueList([item.deviceTypes || [], 'desktop']).map(type => normalize(type) === 'laptop' ? 'desktop' : type),
                    access: item.access || 'free',
                    visible: item.visible !== false,
                    width,
                    height,
                    resolution: item.resolution || (width && height ? `${width}x${height}` : 'Desktop'),
                    format: item.format || 'PNG',
                    source: 'desktop-static'
                };
            }).filter(item => item.visible !== false);
        }

        function mergeWallpaperLists(...lists) {
            const seen = new Set();
            return lists.flat().filter(item => {
                const key = item.id || item.imageUrl || item.preview || item.thumbnail;
                if (!key || seen.has(key)) return false;
                seen.add(key);
                return true;
            });
        }

        function getDesktopIdentityKeys(item) {
            return uniqueList([
                item.id,
                item.slug,
                item.publicId,
                item.cloudinaryPublicId,
                item.title
            ].map(value => normalize(value)));
        }

        function mixWallpaperLists(primaryItems = [], desktopItems = []) {
            const mixed = [];
            let desktopIndex = 0;
            const desktopKeys = new Set(desktopItems.flatMap(getDesktopIdentityKeys));
            const preferredPrimaryItems = primaryItems.filter(item => {
                const matchesDesktopStatic = getDesktopIdentityKeys(item).some(key => desktopKeys.has(key));
                if (!matchesDesktopStatic) return true;
                return isPremiumWallpaper(item);
            });
            const protectedPremiumIds = new Set(
                preferredPrimaryItems
                    .filter(isPremiumWallpaper)
                    .flatMap(getDesktopIdentityKeys)
            );
            const availableDesktopItems = desktopItems.filter(item => !getDesktopIdentityKeys(item).some(key => protectedPremiumIds.has(key)));
            preferredPrimaryItems.forEach((item, index) => {
                mixed.push(item);
                if ((index + 1) % 3 === 0 && desktopIndex < availableDesktopItems.length) {
                    mixed.push(availableDesktopItems[desktopIndex]);
                    desktopIndex += 1;
                }
            });
            return mergeWallpaperLists(mixed, availableDesktopItems.slice(desktopIndex));
        }

        function getResolutionSize(item) {
            const resolution = String(item.resolution || '');
            const match = resolution.match(/(\d{3,5})\s*[x×]\s*(\d{3,5})/i);
            return {
                width: Number(item.width) || (match ? Number(match[1]) : 0),
                height: Number(item.height) || (match ? Number(match[2]) : 0)
            };
        }

        function isWideWallpaper(item) {
            const size = getResolutionSize(item);
            return size.width > size.height && size.width >= 1200;
        }

        function getDeviceTypes(item) {
            const explicit = uniqueList([item.deviceTypes || [], item.deviceType || '', item.device || ''])
                .map(type => normalize(type) === 'laptop' ? 'desktop' : normalize(type));
            const devices = new Set(explicit);
            if (!devices.size) {
                const size = getResolutionSize(item);
                if (size.width && size.height) {
                    if (size.width > size.height) {
                        devices.add('desktop');
                    } else {
                        devices.add('mobile');
                    }
                } else {
                    devices.add('mobile');
                }
            }
            return Array.from(devices);
        }

        function getSearchText(item) {
            return normalize([
                item.title,
                item.description,
                item.access,
                item.resolution,
                ...getItemTypes(item),
                ...getItemTags(item),
                ...getDeviceTypes(item)
            ].join(' '));
        }

        function matchesAliasText(item, aliases) {
            const searchText = getSearchText(item);
            return aliases.map(normalize).some(alias => searchText.includes(alias));
        }

        function matchesCategory(item, category) {
            if (category === 'All') return true;
            const normalizedCategory = normalize(category);
            const types = getItemTypes(item).map(normalize);
            if (types.includes(normalizedCategory)) return true;
            const featured = featuredCategories.find(config => normalize(config.value) === normalizedCategory || normalize(config.label) === normalizedCategory);
            return featured ? matchesAliasText(item, featured.aliases) : false;
        }

        function matchesStyle(item, style) {
            if (style === 'All') return true;
            const normalizedStyle = normalize(style);
            const size = getResolutionSize(item);
            if (normalizedStyle === '4k' && size.width >= 3840) return true;
            return getSearchText(item).includes(normalizedStyle);
        }

        function matchesDevice(item, device) {
            if (device === 'All') return true;
            const normalizedDevice = normalize(device);
            return getDeviceTypes(item).includes(normalizedDevice);
        }

        function isPremiumWallpaper(item) {
            return String(item && item.access || '').toLowerCase() === 'premium';
        }

        function crownIconMarkup() {
            return `
                <span class="wallpaper-premium-badge" title="Premium wallpaper" aria-label="Premium wallpaper">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M5 18h14l1-10-5 4-3-6-3 6-5-4 1 10Z"></path>
                        <path d="M5 18h14v2H5z"></path>
                    </svg>
                </span>
            `;
        }

        function canDownloadWallpaper(item) {
            return !isPremiumWallpaper(item) || isPremiumMember;
        }

        function shuffleWallpapers(items) {
            const shuffled = [...items];
            for (let index = shuffled.length - 1; index > 0; index -= 1) {
                const randomIndex = Math.floor(Math.random() * (index + 1));
                [shuffled[index], shuffled[randomIndex]] = [shuffled[randomIndex], shuffled[index]];
            }
            return shuffled;
        }

        function slugifyTitle(value) {
            const slug = String(value || '')
                .toLowerCase()
                .replace(/&/g, ' and ')
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/^-+|-+$/g, '')
                .replace(/-{2,}/g, '-');
            return slug || 'pmw-wallpaper';
        }

        function shortSlugId(value) {
            return String(value || '')
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, '')
                .slice(-8) || 'image';
        }

        function buildWallpaperPageUrls(items) {
            const baseSlugs = items.map(item => slugifyTitle(item.title));
            const counts = new Map();
            baseSlugs.forEach(slug => counts.set(slug, (counts.get(slug) || 0) + 1));

            const used = new Set();
            const urls = {};
            items.forEach((item, index) => {
                const base = baseSlugs[index];
                let slug = counts.get(base) > 1 ? `${base}-${shortSlugId(item.id)}` : base;
                let suffix = 2;
                while (used.has(slug)) {
                    slug = `${base}-${shortSlugId(item.id)}-${suffix}`;
                    suffix += 1;
                }
                used.add(slug);
                urls[item.id] = `wallpapers/${slug}.html`;
            });
            return urls;
        }

        let wallpaperPageUrls = {};

        function getWallpaperPageUrl(item) {
            if (isPremiumWallpaper(item)) {
                return `#wallpaper-${encodeURIComponent(item.id)}`;
            }
            return (window.PMW_WALLPAPER_PAGES && window.PMW_WALLPAPER_PAGES[item.id])
                || wallpaperPageUrls[item.id]
                || `#wallpaper-${encodeURIComponent(item.id)}`;
        }

        function opensPanelOnly(item) {
            if (isPremiumWallpaper(item)) return true;
            return !((window.PMW_WALLPAPER_PAGES && window.PMW_WALLPAPER_PAGES[item.id]) || wallpaperPageUrls[item.id]);
        }

        function renderFilters() {
            const categories = [
                'All',
                ...Array.from(new Set([
                    ...configuredCategories,
                    ...randomizedWallpapers.flatMap(getItemTypes)
                ].map(normalizeCategoryType).filter(Boolean))).sort()
            ];

            const popularStyles = ['All', '4K', 'anime', 'nature', 'galaxy', 'dark', 'aesthetic', 'fantasy', 'samurai', 'minimal'];
            const dynamicTags = Array.from(new Set(randomizedWallpapers.flatMap(getItemTags))).sort();
            const styles = uniqueList([...popularStyles, ...dynamicTags]).slice(0, 80);

            categoryFilterSelect.innerHTML = categories.map(category => `
                <option value="${escapeHtml(category)}" ${category === activeCategory ? 'selected' : ''}>${escapeHtml(getCategoryLabel(category))}</option>
            `).join('');

            styleFilterSelect.innerHTML = styles.map(style => `
                <option value="${escapeHtml(style)}" ${normalize(style) === normalize(activeStyle) ? 'selected' : ''}>${style === 'All' ? 'All styles' : escapeHtml(style)}</option>
            `).join('');

            accessFilterSelect.value = activeAccess;
            deviceToggle.querySelectorAll('.device-toggle-btn').forEach(button => {
                const active = normalize(button.dataset.deviceValue) === normalize(activeDevice);
                button.classList.toggle('active', active);
                button.setAttribute('aria-pressed', active ? 'true' : 'false');
            });

            quickFilters.querySelectorAll('.filter-chip').forEach(button => {
                const type = button.dataset.filterType;
                const value = button.dataset.filterValue;
                const active = (type === 'category' && normalize(activeCategory) === normalize(value))
                    || (type === 'tag' && normalize(activeStyle) === normalize(value));
                button.classList.toggle('active', active);
            });
        }

        function getFilteredWallpapers() {
            const q = normalize(searchQuery);
            return randomizedWallpapers.filter(item => {
                const categoryMatch = matchesCategory(item, activeCategory);
                const deviceMatch = matchesDevice(item, activeDevice);
                const styleMatch = matchesStyle(item, activeStyle);
                const accessMatch = activeAccess === 'All' || normalize(item.access) === normalize(activeAccess);
                const searchText = getSearchText(item);
                return categoryMatch && deviceMatch && styleMatch && accessMatch && (!q || searchText.includes(q));
            });
        }

        function renderLoading(message = 'Loading wallpapers...') {
            grid.innerHTML = `<div class="empty-state">${escapeHtml(message)}</div>`;
        }

        function getWallpaperCardMarkup(item, options = {}) {
            const devices = getDeviceTypes(item);
            const wide = options.wide || devices.includes('desktop') || isWideWallpaper(item);
            const orientationClass = wide ? 'is-desktop' : 'is-mobile';
            const aspect = wide ? '16 / 9' : '9 / 16';
            return `
                <a class="wallpaper-card ${orientationClass}" data-id="${escapeHtml(item.id)}" data-panel-only="${opensPanelOnly(item) ? 'true' : 'false'}" href="${escapeHtml(getWallpaperPageUrl(item))}" style="--wallpaper-aspect: ${escapeHtml(aspect)}">
                    <div class="wallpaper-thumb">
                        <img src="${escapeHtml(item.thumbnail)}" alt="${escapeHtml(item.title)}" loading="lazy">
                        <span class="wallpaper-hd-badge">HD</span>
                        <span class="wallpaper-save-chip" role="button" tabindex="0" data-save-wallpaper data-wallpaper-id="${escapeHtml(item.id)}" data-wallpaper-title="${escapeHtml(item.title)}" data-wallpaper-image="${escapeHtml(item.thumbnail || item.preview)}" data-wallpaper-url="${escapeHtml(getWallpaperPageUrl(item))}" data-wallpaper-category="${escapeHtml(getItemTypes(item).map(getCategoryLabel).join(', '))}" aria-pressed="false" aria-label="Save wallpaper"></span>
                        ${isPremiumWallpaper(item) ? crownIconMarkup() : ''}
                    </div>
                    <div class="wallpaper-card-info">
                        <h3 class="wallpaper-card-title">${escapeHtml(item.title)}</h3>
                    </div>
                </a>
            `;
        }

        function getCategoryCardsMarkup() {
            return featuredCategories.map(config => {
                const item = findPreviewItem(wallpaper => matchesCategory(wallpaper, config.value) || matchesAliasText(wallpaper, config.aliases));
                const image = item ? item.thumbnail : '';
                return `
                    <a class="category-card" href="pmw-wallpapers.html?category=${encodeURIComponent(config.value)}#latest-wallpapers" data-category="${escapeHtml(config.value)}" style="--card-image: url('${escapeHtml(image)}')">
                        <div class="category-card-body">
                            <h3>${escapeHtml(config.label)}</h3>
                            <span>Browse ${escapeHtml(config.label)} wallpapers</span>
                        </div>
                    </a>
                `;
            }).join('');
        }

        function getCategoryMarqueeMarkup() {
            const cards = getCategoryCardsMarkup();
            return `
                <div class="category-marquee feed-insert" aria-label="Browse wallpaper categories">
                    <div class="category-card-grid category-marquee-track" aria-live="polite">
                        ${cards}${cards}
                    </div>
                </div>
            `;
        }

        function getDesktopRowMarkup(items) {
            if (activeDevice !== 'desktop' || !items.length) return '';
            return `
                <section class="desktop-wallpapers-row feed-insert" aria-label="Desktop wallpaper picks">
                    ${items.map(item => getWallpaperCardMarkup(item, { wide: true })).join('')}
                </section>
            `;
        }

        function getFeedColumnCount() {
            const columns = window.getComputedStyle(grid).gridTemplateColumns
                .split(' ')
                .filter(Boolean).length;
            return columns || (window.matchMedia('(max-width: 768px)').matches ? 2 : 4);
        }

        function renderWallpapers() {
            const items = getFilteredWallpapers();
            const columns = getFeedColumnCount();
            const firstCount = Math.max(columns * 2, window.matchMedia('(max-width: 768px)').matches ? 4 : 8);
            const midCount = Math.max(columns, window.matchMedia('(max-width: 768px)').matches ? 4 : 4);
            const desktopInsertCount = activeDevice === 'desktop' ? 4 : 0;
            const firstItems = items.slice(0, firstCount);
            const midItems = items.slice(firstCount, firstCount + midCount);
            const desktopItems = items.slice(firstCount + midCount, firstCount + midCount + desktopInsertCount);
            const restItems = items.slice(firstCount + midCount + desktopInsertCount);

            if (!items.length) {
                const message = wallpapers.length
                    ? 'No wallpapers found. Try another search or category.'
                    : 'No wallpapers loaded yet. Firestore is empty and the static fallback has no visible free wallpapers.';
                grid.innerHTML = `<div class="empty-state">${escapeHtml(message)}</div>`;
                renderFilters();
                return;
            }

            grid.innerHTML = [
                firstItems.map(item => getWallpaperCardMarkup(item)).join(''),
                getCategoryMarqueeMarkup(),
                midItems.map(item => getWallpaperCardMarkup(item)).join(''),
                getDesktopRowMarkup(desktopItems),
                restItems.map(item => getWallpaperCardMarkup(item)).join('')
            ].join('');
            renderFilters();
        }

        function findPreviewItem(matchFn) {
            return randomizedWallpapers.find(matchFn) || randomizedWallpapers[0] || null;
        }

        function updateHeroImage() {
            const item = randomizedWallpapers.find(wallpaper => matchesStyle(wallpaper, 'galaxy') || matchesStyle(wallpaper, 'fantasy') || matchesStyle(wallpaper, 'dark')) || randomizedWallpapers[0];
            if (item && hero) {
                hero.style.setProperty('--hero-image', `url('${item.preview || item.thumbnail}')`);
            }
        }

        function renderBrowseSections() {
            updateHeroImage();
        }

        function openPanel(id) {
            const item = wallpapers.find(wallpaper => wallpaper.id === id);
            if (!item) return;
            selectedWallpaper = item;
            if (window.PMW_DOWNLOAD_TRACKING) {
                window.PMW_DOWNLOAD_TRACKING.trackView({
                    id: item.id,
                    title: item.title,
                    category: getItemTypes(item).map(getCategoryLabel).join(', '),
                    image: item.thumbnail || item.preview || item.image || '',
                    url: getWallpaperPageUrl(item),
                    type: 'wallpaper'
                });
            }
            document.getElementById('panelImage').src = item.preview;
            document.getElementById('panelImage').alt = item.title;
            panelImageFrame.classList.toggle('has-premium-watermark', isPremiumWallpaper(item));
            document.getElementById('panelCategory').textContent = getItemTypes(item).map(getCategoryLabel).join(' / ');
            document.getElementById('panelTitle').textContent = item.title;
            document.getElementById('panelDescription').textContent = item.description;
            document.getElementById('panelResolution').textContent = item.resolution;
            document.getElementById('panelFormat').textContent = item.format || 'Image';
            document.getElementById('panelTags').innerHTML = (item.tags || []).map(tag => `<span class="hashtag">#${escapeHtml(tag)}</span>`).join('');
            panelDownload.classList.toggle('locked', !canDownloadWallpaper(item));
            panelDownload.innerHTML = canDownloadWallpaper(item)
                ? `
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                    Download Wallpaper
                `
                : `
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 3l3 6 5-4-1 10H5L4 5l5 4 3-6Z"></path>
                        <path d="M5 19h14"></path>
                    </svg>
                    ${signedInUser ? 'Upgrade to Download' : 'Sign In to Unlock'}
                `;
            panel.classList.add('active');
            document.body.classList.add('panel-open');
        }

        function closePanel() {
            panel.classList.remove('active');
            document.body.classList.remove('panel-open');
            panelImageFrame.classList.remove('has-premium-watermark');
            selectedWallpaper = null;
        }

        function getRandomDownloadName() {
            const randomNumber = Math.floor(10000 + Math.random() * 90000);
            return `PMW_Wallpapers_${randomNumber}`;
        }

        function getNamedDownloadUrl(url) {
            const downloadName = getRandomDownloadName();
            return String(url || '').replace('/fl_attachment/', `/fl_attachment:${downloadName}/`);
        }

        quickFilters.addEventListener('click', event => {
            const button = event.target.closest('.filter-chip');
            if (!button) return;
            const type = button.dataset.filterType;
            const value = button.dataset.filterValue;
            if (type === 'category') activeCategory = activeCategory === value ? 'All' : value;
            if (type === 'tag') activeStyle = normalize(activeStyle) === normalize(value) ? 'All' : value;
            renderWallpapers();
            document.getElementById('latest-wallpapers').scrollIntoView({ behavior: 'smooth', block: 'start' });
        });

        categoryFilterSelect.addEventListener('change', event => {
            activeCategory = event.target.value;
            renderWallpapers();
        });

        deviceToggle.addEventListener('click', event => {
            const button = event.target.closest('.device-toggle-btn');
            if (!button) return;
            activeDevice = button.dataset.deviceValue || 'mobile';
            renderWallpapers();
        });

        styleFilterSelect.addEventListener('change', event => {
            activeStyle = event.target.value;
            renderWallpapers();
        });

        accessFilterSelect.addEventListener('change', event => {
            activeAccess = event.target.value;
            renderWallpapers();
        });

        search.addEventListener('input', event => {
            searchQuery = event.target.value;
            renderWallpapers();
        });

        function handleWallpaperGridClick(event) {
            if (event.target.closest('[data-save-wallpaper]')) return;

            const categoryCard = event.target.closest('.category-card');
            if (categoryCard) {
                event.preventDefault();
                activeCategory = categoryCard.dataset.category || 'All';
                renderWallpapers();
                document.getElementById('latest-wallpapers').scrollIntoView({ behavior: 'smooth', block: 'start' });
                return;
            }

            const card = event.target.closest('.wallpaper-card');
            if (!card || card.dataset.panelOnly !== 'true') return;
            event.preventDefault();
            openPanel(card.dataset.id);
        }

        grid.addEventListener('click', handleWallpaperGridClick);
        grid.addEventListener('keydown', event => {
            const saveChip = event.target.closest('[data-save-wallpaper]');
            if (saveChip && (event.key === 'Enter' || event.key === ' ')) {
                event.preventDefault();
                saveChip.click();
            }
        });

        panelDownload.addEventListener('click', async () => {
            if (!selectedWallpaper) return;
            if (!canDownloadWallpaper(selectedWallpaper)) {
                window.location.href = signedInUser ? 'premium.html' : 'login.html';
                return;
            }
            if (window.PMW_DOWNLOAD_TRACKING) {
                window.PMW_DOWNLOAD_TRACKING.trackDownload({
                    id: selectedWallpaper.id,
                    title: selectedWallpaper.title,
                    category: getItemTypes(selectedWallpaper).map(getCategoryLabel).join(', '),
                    image: selectedWallpaper.thumbnail || selectedWallpaper.preview || selectedWallpaper.image || '',
                    url: location.href,
                    type: 'wallpaper'
                });
            }
            if (selectedWallpaper.source === 'desktop-static' && selectedWallpaper.access !== 'premium') {
                window.location.href = selectedWallpaper.download || selectedWallpaper.imageUrl;
                return;
            }
            try {
                const { requestWallpaperDownload, navigateForDownloadError } = await import('./js/secure-wallpaper-download.js');
                const downloadUrl = await requestWallpaperDownload(selectedWallpaper.id);
                window.location.href = downloadUrl;
            } catch (error) {
                const { navigateForDownloadError } = await import('./js/secure-wallpaper-download.js');
                if (!navigateForDownloadError(error)) {
                    console.error('Unable to download wallpaper.', error);
                    panelDownload.textContent = error.message || 'Download failed. Try again.';
                }
            }
        });

        panelClose.addEventListener('click', closePanel);
        panel.addEventListener('click', event => {
            if (event.target === panel) closePanel();
        });
        document.addEventListener('keydown', event => {
            if (event.key === 'Escape') closePanel();
        });
        window.addEventListener('scroll', () => {
            document.getElementById('navbar').classList.toggle('scrolled', window.scrollY > 30);
        });

        function setActiveCategoryFromAvailable() {
            const availableCategories = new Set([
                ...configuredCategories,
                ...wallpapers.flatMap(getItemTypes)
            ]);
            const featuredMatch = featuredCategories.find(config => normalize(config.value) === normalize(requestedCategory) || normalize(config.label) === normalize(requestedCategory));
            activeCategory = requestedCategory && availableCategories.has(requestedCategory)
                ? requestedCategory
                : featuredMatch
                    ? featuredMatch.value
                    : 'All';
            activeDevice = requestedDevice && ['desktop', 'mobile'].includes(normalize(requestedDevice))
                ? normalize(requestedDevice)
                : 'mobile';
            updateCategorySeo(activeCategory);
        }

        async function initializeWallpaperPage() {
            renderLoading();
            try {
                const { loadVisibleWallpapers } = await import('./js/wallpaper-source.js?v=20260718-premium-meta');
                const [freeResult, premiumResult] = await Promise.all([
                    loadVisibleWallpapers({
                        access: 'free',
                        fallback: window.PMW_WALLPAPERS || []
                    }),
                    loadVisibleWallpapers({
                        access: 'premium',
                        fallback: window.PMW_WALLPAPERS || [],
                        allowFallback: false
                    }).catch(error => ({
                        items: [],
                        source: 'firestore',
                        error
                    }))
                ]);
                const desktopItems = normalizeDesktopWallpapers(window.PMW_DESKTOP_WALLPAPERS || []);
                wallpapers = mixWallpaperLists([...freeResult.items, ...premiumResult.items], desktopItems);
                randomizedWallpapers = shuffleWallpapers(wallpapers);
                wallpaperPageUrls = buildWallpaperPageUrls(wallpapers.filter(item => item.source === 'static'));
                setActiveCategoryFromAvailable();
                renderBrowseSections();
                renderFilters();
                renderWallpapers();

                if (freeResult.error) {
                    console.warn('Firestore free wallpaper loading failed; static fallback was used.', freeResult.error);
                }
                if (premiumResult.error) {
                    console.warn('Firestore premium wallpaper loading failed.', premiumResult.error);
                }
            } catch (error) {
                console.warn('Unable to initialize Firestore wallpaper loading; static fallback was used.', error);
                const desktopItems = normalizeDesktopWallpapers(window.PMW_DESKTOP_WALLPAPERS || []);
                wallpapers = mixWallpaperLists(
                    (window.PMW_WALLPAPERS || []).filter(item => item.visible !== false),
                    desktopItems
                );
                randomizedWallpapers = shuffleWallpapers(wallpapers);
                wallpaperPageUrls = buildWallpaperPageUrls(wallpapers.filter(item => item.source !== 'desktop-static'));
                setActiveCategoryFromAvailable();
                renderBrowseSections();
                renderFilters();
                renderWallpapers();
            }
        }

        async function initializePremiumAccess() {
            try {
                const [{ auth }, { onAuthStateChanged }, { isPremiumUser }] = await Promise.all([
                    import('./js/firebase.js'),
                    import('https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js'),
                    import('./js/premium-access.js?v=20260718-premium-gate')
                ]);

                onAuthStateChanged(auth, async user => {
                    signedInUser = user;
                    isPremiumMember = user ? await isPremiumUser(user) : false;
                    authReady = true;
                    renderWallpapers();
                    if (selectedWallpaper) {
                        openPanel(selectedWallpaper.id);
                    }
                });
            } catch (error) {
                authReady = true;
                signedInUser = null;
                isPremiumMember = false;
                console.warn('Unable to initialize premium access checks.', error);
            }
        }

        initializePremiumAccess();
        initializeWallpaperPage();
    </script>
    <script type="module" src="js/saved-wallpapers.js"></script>
    <script src="consent.js" defer></script>
  <script src="./js/account-menu.js" defer></script>
</body>
